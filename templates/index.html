<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pi ToDo</title>
<style>
  :root {
    --bg: #eef2f7;        --card: #ffffff;   --text: #1f2937;
    --muted: #6b7280;     --border: #e5e7eb;
    --accent: #6366f1;    --accent2: #8b5cf6;
    --danger: #ef4444;    --success: #10b981;
    --shadow: 0 8px 24px rgba(0,0,0,.08);
  }
  [data-theme="dark"] {
    --bg: #0f172a;        --card: #1e293b;   --text: #e2e8f0;
    --muted: #94a3b8;     --border: #334155;
    --shadow: 0 8px 24px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; justify-content: center;
    padding: 40px 16px; transition: background .3s, color .3s;
  }
  .app { width: 100%; max-width: 520px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { background: linear-gradient(90deg, var(--accent), var(--accent2));
       -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2rem; }

  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 12px; box-shadow: var(--shadow); }

  /* stats + progress */
  .stats { display: flex; gap: 16px; align-items: center; padding: 14px 18px; margin-bottom: 16px; }
  .stat { text-align: center; }
  .stat span { font-size: 1.3rem; font-weight: 700; display: block; }
  .stat small { color: var(--muted); }
  .progress { flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress div { height: 100%; width: 0%;
                  background: linear-gradient(90deg, var(--accent), var(--accent2));
                  transition: width .4s ease; }

  /* add form */
  form.card { display: flex; gap: 10px; padding: 10px; margin-bottom: 16px; }
  input { flex: 1; border: none; background: transparent; color: var(--text);
          font-size: 1rem; outline: none; padding: 8px; }
  .btn-primary { border: none; cursor: pointer; color: #fff; font-weight: 600;
                 padding: 10px 18px; border-radius: 8px;
                 background: linear-gradient(90deg, var(--accent), var(--accent2));
                 transition: transform .15s; }
  .btn-primary:hover { transform: scale(1.05); }

  /* filter tabs */
  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filter-btn { border: 1px solid var(--border); background: var(--card); color: var(--muted);
                padding: 6px 16px; border-radius: 99px; cursor: pointer; transition: .2s; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* todo list */
  ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; } }
  .todo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; animation: slideIn .25s ease; }
  .todo.removing { opacity: 0; transform: translateX(40px); transition: .25s; }
  .title { flex: 1; }
  .is-done .title { text-decoration: line-through; color: var(--muted); }

  .check { width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
           border: 2px solid var(--accent); background: transparent;
           color: #fff; font-size: 14px; line-height: 1; transition: .2s; }
  .is-done .check { background: var(--success); border-color: var(--success); }

  .icon-btn { border: none; background: transparent; cursor: pointer; font-size: 1.1rem; }
  .del { opacity: .4; transition: .2s; }
  .del:hover { opacity: 1; transform: scale(1.15); }

  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); margin-top: 30px; font-size: .85rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🍓 Pi ToDo</h1>
    <button id="theme-btn" class="icon-btn" title="Toggle theme">🌙</button>
  </header>

  <section class="stats card">
    <div class="stat"><span id="stat-total">0</span><small>total</small></div>
    <div class="stat"><span id="stat-active">0</span><small>active</small></div>
    <div class="stat"><span id="stat-done">0</span><small>done</small></div>
    <div class="progress"><div id="progress-bar"></div></div>
  </section>

  <form id="add-form" class="card">
    <input id="title-input" placeholder="What needs doing?" autocomplete="off" required>
    <button class="btn-primary" type="submit">+ Add</button>
  </form>

  <nav class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="active">Active</button>
    <button class="filter-btn" data-filter="done">Done</button>
  </nav>

  <ul id="todo-list"></ul>
  <p id="empty" class="empty hidden">Nothing here 🎉</p>

  <footer>Flask + SQLite on a Raspberry Pi 🍓</footer>
</div>

<script>
  const list = document.getElementById('todo-list');
  const emptyMsg = document.getElementById('empty');
  const form = document.getElementById('add-form');
  const input = document.getElementById('title-input');
  const themeBtn = document.getElementById('theme-btn');
  const filterBtns = document.querySelectorAll('.filter-btn');

  let todos = [];
  let filter = 'all';

  /* ---------- dark mode (remembered in browser) ---------- */
  const saved = localStorage.getItem('theme') || 'light';
  setTheme(saved);
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    setTheme(next);
    localStorage.setItem('theme', next);
  });
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  }

  /* ---------- filter tabs ---------- */
  filterBtns.forEach(btn => btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    filterBtns.forEach(b => b.classList.toggle('active', b === btn));
    render();
  }));

  /* ---------- data ---------- */
  async function loadTodos() {
    const res = await fetch('/todos');
    todos = await res.json();
    render();
  }

  function render() {
    const visible = todos.filter(t =>
      filter === 'all' ? true : (filter === 'active' ? !t.done : t.done));

    list.innerHTML = '';
    visible.forEach(t => {
      const li = document.createElement('li');
      li.className = 'todo card' + (t.done ? ' is-done' : '');
      li.innerHTML = `
        <button class="check" onclick="toggleTodo(${t.id})">${t.done ? '✓' : ''}</button>
        <span class="title">${escapeHtml(t.title)}</span>
        <button class="icon-btn del" onclick="deleteTodo(${t.id}, this)" title="delete">🗑</button>`;
      list.appendChild(li);
    });
    emptyMsg.classList.toggle('hidden', visible.length > 0);

    const total = todos.length;
    const done = todos.filter(t => t.done).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-active').textContent = total - done;
    document.getElementById('stat-done').textContent = done;
    document.getElementById('progress-bar').style.width =
      total ? (done / total * 100) + '%' : '0%';
  }

  /* security: never inject raw text as HTML */
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const title = input.value.trim();
    if (!title) return;
    await fetch('/todos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title })
    });
    input.value = '';
    loadTodos();
  });

  async function toggleTodo(id) {
    await fetch(`/todos/${id}/done`, { method: 'PATCH' });
    loadTodos();
  }

  async function deleteTodo(id, btn) {
    const li = btn.closest('li');
    li.classList.add('removing');
    await new Promise(r => setTimeout(r, 250));
    await fetch(`/todos/${id}`, { method: 'DELETE' });
    loadTodos();
  }

  loadTodos();
</script>
</body>
</html>
